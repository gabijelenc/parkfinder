<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Ilustración arquitectónica de playa accesible de alta altura libre junto al Hospital Italiano">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1B3147"/>
    </linearGradient>
    <linearGradient id="mintGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  
    <rect x="0" y="230" width="640" height="130" fill="url(#floor)"/>
    <!-- Clean modern institutional building backdrop -->
    <rect x="70" y="54" width="500" height="176" rx="10" fill="#162238" stroke="#334155" stroke-width="2"/>
