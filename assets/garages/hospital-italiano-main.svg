    <text x="320" y="92" text-anchor="middle" fill="#34D399" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800">MÁX 3.00 m</text>
    <!-- Wide accessible bay markings -->
    <rect x="188" y="252" width="264" height="84" rx="10" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="10 6"/>
    <circle cx="222" cy="294" r="18" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
    <text x="222" y="300" text-anchor="middle" fill="#34D399" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800">♿</text>
