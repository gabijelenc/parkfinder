<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Ilustración arquitectónica de playa urbana 24 hs cerca del Obelisco">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="mintGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  
    <!-- Dusk skyline + Obelisco silhouette -->
    <g fill="#1E293B" opacity="0.85">
      <rect x="44" y="88" width="60" height="148"/>
      <rect x="116" y="64" width="52" height="172"/>
      <rect x="470" y="72" width="68" height="164"/>
      <rect x="548" y="96" width="50" height="140"/>
      <!-- Obelisco -->
      <polygon points="320,26 309,46 305,236 335,236 331,46" fill="#334155"/>
      <polygon points="320,26 331,46 335,236 320,236" fill="#475569" opacity="0.6"/>
    </g>
    <!-- Open deck floor -->
    <rect x="0" y="232" width="640" height="128" fill="url(#floor)"/>
    <!-- Street lamps -->
    <g stroke="#64748B" stroke-width="3">
      <line x1="150" y1="120" x2="150" y2="234"/>
      <line x1="490" y1="120" x2="490" y2="234"/>
    </g>
    <circle cx="150" cy="118" r="8" fill="#34D399"/>
    <circle cx="490" cy="118" r="8" fill="#34D399"/>
    <!-- 24H Badge -->
    <rect x="252" y="168" width="136" height="28" rx="14" fill="#0B1220" stroke="#34D399" stroke-width="1.8"/>
    <text x="320" y="187" text-anchor="middle" fill="#34D399" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.4">24 HS · CENTRO</text>
    <!-- Bay lines -->
    <path d="M120 360 L195 232 M320 360 L320 232 M520 360 L445 232" stroke="#34D399" stroke-opacity="0.4" stroke-width="3"/>
    <g transform="translate(235,240) scale(0.92)">
      <ellipse cx="0" cy="36" rx="54" ry="9" fill="#020617" opacity="0.55"/>
      <path d="M-38 2 L-28 -20 C-25 -26 -19 -28 -12 -28 L12 -28 C19 -28 25 -26 28 -20 L38 2 Z" fill="#F8FAFC" opacity="0.95"/>
      <path d="M-26 -2 L-20 -18 C-18 -22 -14 -23 -8 -23 L8 -23 C14 -23 18 -22 20 -18 L26 -2 Z" fill="#0B1220" opacity="0.78"/>
      <rect x="-46" y="0" width="92" height="26" rx="9" fill="#F8FAFC"/>
      <rect x="-40" y="22" width="16" height="12" rx="4" fill="#0B1220"/>
      <rect x="24" y="22" width="16" height="12" rx="4" fill="#0B1220"/>
      <rect x="-38" y="7" width="16" height="6" rx="3" fill="#34D399"/>
      <rect x="22" y="7" width="16" height="6" rx="3" fill="#34D399"/>
      <rect x="-15" y="9" width="30" height="8" rx="3" fill="#334155"/>
      <rect x="-10" y="12" width="20" height="2" rx="1" fill="#94A3B8"/>
    </g>
    <g transform="translate(410,240) scale(0.92)">
      <ellipse cx="0" cy="36" rx="54" ry="9" fill="#020617" opacity="0.55"/>
      <path d="M-38 2 L-28 -20 C-25 -26 -19 -28 -12 -28 L12 -28 C19 -28 25 -26 28 -20 L38 2 Z" fill="#94A3B8" opacity="0.95"/>
      <path d="M-26 -2 L-20 -18 C-18 -22 -14 -23 -8 -23 L8 -23 C14 -23 18 -22 20 -18 L26 -2 Z" fill="#0B1220" opacity="0.78"/>
      <rect x="-46" y="0" width="92" height="26" rx="9" fill="#94A3B8"/>
      <rect x="-40" y="22" width="16" height="12" rx="4" fill="#0B1220"/>
      <rect x="24" y="22" width="16" height="12" rx="4" fill="#0B1220"/>
      <rect x="-38" y="7" width="16" height="6" rx="3" fill="#34D399"/>
      <rect x="22" y="7" width="16" height="6" rx="3" fill="#34D399"/>
      <rect x="-15" y="9" width="30" height="8" rx="3" fill="#334155"/>
      <rect x="-10" y="12" width="20" height="2" rx="1" fill="#94A3B8"/>
    </g>
    
</svg>
