      <path d="M-26 -2 L-20 -18 C-18 -22 -14 -23 -8 -23 L8 -23 C14 -23 18 -22 20 -18 L26 -2 Z" fill="#0B1220" opacity="0.78"/>
      <rect x="-46" y="0" width="92" height="26" rx="9" fill="#F8FAFC"/>
      <rect x="-40" y="22" width="16" height="12" rx="4" fill="#0B1220"/>
      <rect x="24" y="22" width="16" height="12" rx="4" fill="#0B1220"/>
      <rect x="-38" y="7" width="16" height="6" rx="3" fill="#34D399"/>
