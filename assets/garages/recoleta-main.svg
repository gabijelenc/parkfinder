    <g fill="#34D399">
      <rect x="180" y="104" width="44" height="5" rx="2.5"/>
      <rect x="298" y="104" width="44" height="5" rx="2.5"/>
      <rect x="416" y="104" width="44" height="5" rx="2.5"/>
    </g>
    <rect x="180" y="109" width="280" height="28" fill="url(#mintGlow)"/>
    <!-- Valet Desk -->
    <rect x="412" y="186" width="76" height="50" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
    <text x="450" y="216" text-anchor="middle" fill="#34D399" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700">VALET</text>
    <path d="M165 360 L215 236 M455 360 L405 236" stroke="#34D399" stroke-opacity="0.38" stroke-width="3"/>
    <g transform="translate(296,234) scale(1.04)">
