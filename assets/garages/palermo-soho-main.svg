<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Ilustración arquitectónica de cochera cubierta urbana en Palermo Soho">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="mintGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  
    <rect x="0" y="236" width="640" height="124" fill="url(#floor)"/>
    <!-- Brick/steel facade blocks -->
    <rect x="52" y="62" width="536" height="174" rx="14" fill="#172033" stroke="#334155" stroke-width="2"/>
    <path d="M98 236 L98 138 C98 106 124 94 156 94 L484 94 C516 94 542 106 542 138 L542 236 Z" fill="#0B1220"/>
    <!-- Warm architectural slats -->
    <g stroke="#334155" stroke-width="3">
      <line x1="120" y1="94" x2="120" y2="236"/>
      <line x1="520" y1="94" x2="520" y2="236"/>
    </g>
    <!-- Overhead light bar -->
    <rect x="190" y="108" width="260" height="5" rx="2.5" fill="#34D399"/>
    <rect x="190" y="113" width="260" height="32" fill="url(#mintGlow)"/>
    <!-- Green foliage silhouettes -->
    <circle cx="72" cy="212" r="24" fill="#065F46" opacity="0.8"/>
    <circle cx="568" cy="212" r="24" fill="#065F46" opacity="0.8"/>
    <!-- Bay markings -->
    <path d="M168 358 L224 236 M472 358 L416 236" stroke="#94A3B8" stroke-opacity="0.45" stroke-width="3"/>
    <rect x="260" y="54" width="120" height="28" rx="7" fill="#0B1220" stroke="#34D399" stroke-width="1.8"/>
    <text x="320" y="72" text-anchor="middle" fill="#F8FAFC" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="1">SOHO · CUBIERTO</text>
    <g transform="translate(320,232) scale(1.08)">
      <ellipse cx="0" cy="36" rx="54" ry="9" fill="#020617" opacity="0.55"/>
      <path d="M-38 2 L-28 -20 C-25 -26 -19 -28 -12 -28 L12 -28 C19 -28 25 -26 28 -20 L38 2 Z" fill="#F8FAFC" opacity="0.95"/>
      <path d="M-26 -2 L-20 -18 C-18 -22 -14 -23 -8 -23 L8 -23 C14 -23 18 -22 20 -18 L26 -2 Z" fill="#0B1220" opacity="0.78"/>
      <rect x="-46" y="0" width="92" height="26" rx="9" fill="#F8FAFC"/>
      <rect x="-40" y="22" width="16" height="12" rx="4" fill="#0B1220"/>
      <rect x="24" y="22" width="16" height="12" rx="4" fill="#0B1220"/>
      <rect x="-38" y="7" width="16" height="6" rx="3" fill="#34D399"/>
      <rect x="22" y="7" width="16" height="6" rx="3" fill="#34D399"/>
      <rect x="-15" y="9" width="30" height="8" rx="3" fill="#334155"/>
      <rect x="-10" y="12" width="20" height="2" rx="1" fill="#94A3B8"/>
    </g>
    
</svg>
