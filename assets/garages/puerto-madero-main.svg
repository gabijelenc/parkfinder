      <rect x="-38" y="7" width="16" height="6" rx="3" fill="#34D399"/>
      <rect x="22" y="7" width="16" height="6" rx="3" fill="#34D399"/>
      <rect x="-15" y="9" width="30" height="8" rx="3" fill="#334155"/>
      <rect x="-10" y="12" width="20" height="2" rx="1" fill="#94A3B8"/>
    </g>
    <g transform="translate(392,238) scale(0.88)">
      <ellipse cx="0" cy="36" rx="54" ry="9" fill="#020617" opacity="0.55"/>
      <path d="M-38 2 L-28 -20 C-25 -26 -19 -28 -12 -28 L12 -28 C19 -28 25 -26 28 -20 L38 2 Z" fill="#CBD5E1" opacity="0.95"/>
      <path d="M-26 -2 L-20 -18 C-18 -22 -14 -23 -8 -23 L8 -23 C14 -23 18 -22 20 -18 L26 -2 Z" fill="#0B1220" opacity="0.78"/>
      <rect x="-46" y="0" width="92" height="26" rx="9" fill="#CBD5E1"/>
      <rect x="-40" y="22" width="16" height="12" rx="4" fill="#0B1220"/>
      <rect x="24" y="22" width="16" height="12" rx="4" fill="#0B1220"/>
      <rect x="-38" y="7" width="16" height="6" rx="3" fill="#34D399"/>
      <rect x="22" y="7" width="16" height="6" rx="3" fill="#34D399"/>
      <rect x="-15" y="9" width="30" height="8" rx="3" fill="#334155"/>
      <rect x="-10" y="12" width="20" height="2" rx="1" fill="#94A3B8"/>
    </g>
    
</svg>
