<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Ilustración arquitectónica de cochera cubierta moderna en Puerto Madero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#162A3E"/>
    </linearGradient>
    <linearGradient id="mintGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  
    <rect x="0" y="235" width="640" height="125" fill="url(#floor)"/>
    <!-- Waterfront skyline silhouette -->
    <g fill="#1E293B" opacity="0.75">
      <rect x="30" y="70" width="44" height="165" rx="3"/>
      <rect x="86" y="45" width="52" height="190" rx="3"/>
      <rect x="520" y="55" width="60" height="180" rx="3"/>
      <rect x="590" y="90" width="36" height="145" rx="3"/>
    </g>
    <!-- Architectural covered canopy -->
    <path d="M120 96 L520 96 L560 128 L80 128 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="135" y="128" width="14" height="118" fill="#334155"/>
    <rect x="491" y="128" width="14" height="118" fill="#334155"/>
    <rect x="149" y="128" width="342" height="108" fill="url(#glass)"/>
    <!-- LED Mint Strip Lighting -->
    <rect x="152" y="114" width="336" height="4" rx="2" fill="#34D399"/>
    <rect x="152" y="118" width="336" height="36" fill="url(#mintGlow)"/>
    <!-- Overhead Bay Sign -->
    <rect x="248" y="64" width="144" height="34" rx="8" fill="#0B1220" stroke="#34D399" stroke-width="2"/>
    <text x="320" y="86" text-anchor="middle" fill="#34D399" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">P · NIVEL 1 · EV</text>
    <!-- Perspective Bay Lines -->
    <path d="M150 360 L215 235 M490 360 L425 235 M320 360 L320 235" stroke="#34D399" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="10 8"/>
    <!-- EV Charger Pillar -->
    <rect x="444" y="176" width="24" height="62" rx="5" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
    <circle cx="456" cy="196" r="5" fill="#34D399"/>
    <path d="M456 205 L452 215 L457 215 L454 224 L462 212 L457 212 Z" fill="#34D399"/>
    <g transform="translate(250,232) scale(0.96)">
      <ellipse cx="0" cy="36" rx="54" ry="9" fill="#020617" opacity="0.55"/>
      <path d="M-38 2 L-28 -20 C-25 -26 -19 -28 -12 -28 L12 -28 C19 -28 25 -26 28 -20 L38 2 Z" fill="#F8FAFC" opacity="0.95"/>
