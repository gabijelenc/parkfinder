<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Ilustración de pasillo peatonal iluminado y ascensor accesible">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1A2B3C"/>
    </linearGradient>
    <linearGradient id="mintGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  
    <rect x="0" y="238" width="640" height="122" fill="url(#floor)"/>
    <rect x="96" y="54" width="448" height="184" rx="12" fill="#152236" stroke="#334155" stroke-width="2"/>
    <!-- Elevator glass doors -->
    <rect x="256" y="102" width="128" height="136" rx="6" fill="#0B1220" stroke="#34D399" stroke-width="2"/>
    <line x1="320" y1="102" x2="320" y2="238" stroke="#334155" stroke-width="2"/>
    <!-- Illuminated Exit Sign -->
    <rect x="266" y="68" width="108" height="24" rx="6" fill="#34D399"/>
    <text x="320" y="84" text-anchor="middle" fill="#0B1220" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="1">SALIDA PEATONAL</text>
    <!-- Floor safety walkway -->
    <polygon points="246,238 394,238 456,360 184,360" fill="#34D399" opacity="0.16"/>
    <line x1="246" y1="238" x2="184" y2="360" stroke="#34D399" stroke-width="3"/>
    <line x1="394" y1="238" x2="456" y2="360" stroke="#34D399" stroke-width="3"/>
    
</svg>
